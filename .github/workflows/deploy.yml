name: Deploy to VDS

on:
  workflow_run:
    workflows: ["Repository checks"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-vds
  cancel-in-progress: false

jobs:
  deploy:
    # Only pushes to main of this repository; never a pull request or a fork.
    if: >-
      github.repository == 'dcip3/DCIP3.TasksBot'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          # A secret rather than a variable, so the log masks the server path.
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          fingerprint: ${{ secrets.VDS_HOST_FINGERPRINT }}
          envs: DEPLOY_PATH,DEPLOY_SHA,REPOSITORY_URL
          script: |
            set -eu
            cd "${DEPLOY_PATH:?add the DEPLOY_PATH repository secret}"
            # A forced fetch and a hard reset also survive a history rewrite
            # or a repository move.
            git remote set-url origin "$REPOSITORY_URL"
            git fetch --quiet --prune origin +refs/heads/main:refs/remotes/origin/main
            # Checks can finish out of order: deploy only the current tip of main.
            if [ "$DEPLOY_SHA" != "$(git rev-parse origin/main)" ]; then
              echo "Skipping $DEPLOY_SHA: main has moved on."
              exit 0
            fi
            git reset --quiet --hard "$DEPLOY_SHA"
            echo "Deploying $(git log -1 --format='%h %s')"
            # Compose names containers after the server directory, so its output
            # stays in a log on the server and only the result is shown here.
            if ! docker compose up -d --build --remove-orphans > deploy.log 2>&1; then
              project=$(basename "$PWD" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9_-')
              tail -n 40 deploy.log | sed -e "s#$PWD#<deploy path>#g" -e "s#$project#<project>#g"
              exit 1
            fi
            # A bot that exits at startup (a bad .env, say) keeps restarting and
            # would still look deployed. Compare with the count right after the
            # start, since a container compose left unchanged keeps its old
            # restarts. The bot's logs can name jobs and users, so they stay on
            # the server.
            container=$(docker compose ps -q tasksbot)
            [ -n "$container" ] || { echo "The bot container is not running."; exit 1; }
            restarts=$(docker inspect -f '{{.RestartCount}}' "$container")
            sleep 20
            state=$(docker inspect -f '{{.State.Status}}, restarts: {{.RestartCount}}' "$container")
            echo "tasksbot: $state"
            if [ "$state" != "running, restarts: $restarts" ]; then
              echo "The bot did not stay up; run docker compose logs tasksbot on the server."
              exit 1
            fi
