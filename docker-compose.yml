services:
  backend:
    build: .
    environment:
      - TG_API_TOKEN=${TG_API_TOKEN}
      - DROPBOX_APP_KEY=${DROPBOX_APP_KEY}
      - DROPBOX_APP_SECRET=${DROPBOX_APP_SECRET}
      - DROPBOX_REFRESH_TOKEN=${DROPBOX_REFRESH_TOKEN}
      - DROPBOX_TEAM_MEMBER_ID=${DROPBOX_TEAM_MEMBER_ID}
      - DROPBOX_ROOT_NAMESPACE_ID=${DROPBOX_ROOT_NAMESPACE_ID}
      - DROPBOX_ROOT_MARKER=${DROPBOX_ROOT_MARKER}
    volumes:
      - ./conv:/app/conv
      - ./temp:/app/temp
      - ./tasks_bot.db:/app/tasks_bot.db
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build: ./mini-app
    environment:
      - VITE_API_URL=https://example.com/api
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/example.com/fullchain.pem:/etc/nginx/ssl/certificate.crt:ro
      - /etc/letsencrypt/live/example.com/privkey.pem:/etc/nginx/ssl/private.key:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge 
