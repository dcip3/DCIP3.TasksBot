services:
  backend:
    build:
      context: .
      dockerfile: infra/backend/Dockerfile
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./mini-app
    environment:
      - VITE_API_URL=https://${APP_DOMAIN}/api
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    env_file:
      - .env
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - /etc/letsencrypt/live/${APP_DOMAIN}/fullchain.pem:/etc/nginx/ssl/certificate.crt:ro
      - /etc/letsencrypt/live/${APP_DOMAIN}/privkey.pem:/etc/nginx/ssl/private.key:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge 
