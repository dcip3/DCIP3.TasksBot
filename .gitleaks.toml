title = "TasksBot secret scan"

[extend]
useDefault = true

# The default telegram-bot-api-token rule needs "telegram" next to the value,
# so it misses tokens in code, bot API URLs and other variable names.
[[rules]]
id = "telegram-bot-token"
description = "Telegram bot token, whatever it is assigned to"
regex = '''(?:^|[^0-9])([0-9]{5,16}:A[A-Za-z0-9_-]{34})(?:[^A-Za-z0-9_-]|$)'''
secretGroup = 1
keywords = [":a"]

[[rules]]
id = "dropbox-short-lived-token"
description = "Dropbox short-lived access token"
regex = '''\bsl\.[A-Za-z0-9._-]{100,}'''
keywords = ["sl."]

[[rules]]
id = "dropbox-team-member-id"
description = "Dropbox Business team member ID"
regex = '''\bdbmid:[A-Za-z0-9_-]{20,}'''
keywords = ["dbmid:"]

[allowlist]
description = "Placeholder Fernet key the tests set, and its base64-decoded form"
regexes = [
  '''^MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=$''',
  '''^0123456789abcdef0123456789abcdef$''',
]
